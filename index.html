<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Signum Fidei</title>

<style>

body{
margin:0;
background:black;
overflow-x:hidden;
}

/* ÁREA DO CONTEÚDO */

.conteudo{
position:relative;
}

/* IMAGEM PRINCIPAL */

.conteudo img{
width:100%;
display:block;
}

/* SLIDER HORIZONTAL */

/* SLIDER */

.slider{

position:absolute;

top:700px; /* POSIÇÃO */

left:0;

right:0;

overflow-x:auto;

overflow-y:hidden;

z-index:500;

}

/* ESCONDE BARRA */

.slider::-webkit-scrollbar{
display:none;
}

/* IMAGEM */

.slider img{

height:180px;

width:auto;

display:block;

}

}

/* MENU INFERIOR FIXO */

.menu{
position:fixed;
bottom:0;
width:100%;
z-index:1000;
}

.menu img{
width:100%;
display:block;
}

/* MENU SUPERIOR */

.topo{
position:fixed;

top:0;
left:0;

width:100%;

z-index:2000;

opacity:0;

transition:0.4s;
}

.topo img{
width:100%;
display:block;
}

</style>
</head>

<body>

<!-- MENU SUPERIOR -->

<div class="topo" id="topo">

<img src="topo.png">

</div>

<!-- CONTEÚDO -->

<div class="conteudo">

<img src="conteudo.png">

<!-- SLIDER -->

<div class="slider">

<img src="slider.png">

</div>

</div>

<!-- MENU INFERIOR -->

<div class="menu">

<img src="menu.png">

</div>

<script>

/* PEGA O MENU SUPERIOR */

const topo = document.getElementById("topo");

window.addEventListener("scroll", function(){

let scroll = window.scrollY;

/* VELOCIDADE DO FADE */

let opacity = (scroll - 50) / 100;

if(opacity < 0){
opacity = 0;
}

if(opacity > 1){
opacity = 1;
}

topo.style.opacity = opacity;

});

</script>

</body>
</html>
