<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Signum Fidei</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:black;
    overflow:hidden;
}

/* ÁREA QUE SOBE E DESCE */

.conteudo{
    width:100%;
    height:100vh;

    overflow-y:scroll;

    padding-bottom:90px;
}

/* IMAGEM PRINCIPAL */

.conteudo img{
    width:100%;
    display:block;
}

/* MENU FIXO */

.menu{
    position:fixed;

    bottom:0;
    left:0;

    width:100%;
    height:80px;

    z-index:1000;
}

.menu img{
    width:100%;
    height:100%;
    object-fit:cover;
}

</style>
</head>

<body>

<!-- CONTEÚDO -->

<div class="conteudo">

    <img src="img/conteudo.png">

</div>

<!-- MENU FIXO -->

<div class="menu">

    <img src="img/menu.png">

</div>

</body>
</html>
