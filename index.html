<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Signum Fidei</title>

<style>

body{
margin:0;
background:black;
overflow-x:hidden;
}

  /* ESCONDE A BARRA DE ROLAGEM */

html::-webkit-scrollbar,
body::-webkit-scrollbar{
display:none;
}

/* ÁREA DO CONTEÚDO */

.conteudo{
position:relative;
}

/* IMAGEM PRINCIPAL */

.conteudo img{
width:100%;
display:block;
}

/* SLIDER HORIZONTAL */

/* SLIDER */

.slider{

position:absolute;

top:100px; /* POSIÇÃO */

left:0;

right:0;

overflow-x:auto;

overflow-y:hidden;

z-index:500;

}

/* ESCONDE BARRA */

.slider::-webkit-scrollbar{
display:none;
}

/* IMAGEM */

.slider img{

height:180px;

width:auto;

display:block;

}


/* MENU INFERIOR FIXO */

.menu{
position:fixed;
bottom:0;
width:100%;
z-index:1000;
}

.menu img{
width:100%;
display:block;
}

  /* SPLASH SCREEN */

#splash{

position:fixed;

top:0;
left:0;

width:100%;
height:100vh;

background:black;

z-index:99999;

display:flex;

justify-content:center;
align-items:center;

transition:1s;
}

#splash img{

width:100%;
height:100%;

object-fit:cover;

}
/* MENU SUPERIOR */

.topo{
position:fixed;

top:0;
left:0;

width:100%;

z-index:2000;

opacity:0;

transition:0.4s;
}

.topo img{
width:100%;
display:block;
}

</style>
</head>

<body>

  <!-- SPLASH SCREEN -->

<div id="splash">

  <img src="splash.png">

</div>
<!-- MENU SUPERIOR -->

<div class="topo" id="topo">

<img src="topo.png">

</div>

<!-- CONTEÚDO -->

<div class="conteudo">

<img src="conteudo.png">

<!-- SLIDER -->

<div class="slider">

<img src="slider.png">

</div>

</div>

<!-- MENU INFERIOR -->

<div class="menu">

<img src="menu.png">

</div>

<script>

/* PEGA O MENU SUPERIOR */
/* SPLASH SCREEN */

window.addEventListener("load", function(){

setTimeout(function(){

document.getElementById("splash").style.opacity = "0";

setTimeout(function(){

document.getElementById("splash").style.display = "none";

},1000);

},2000);

});
  
const topo = document.getElementById("topo");

window.addEventListener("scroll", function(){

let scroll = window.scrollY;

/* VELOCIDADE DO FADE */

let opacity = (scroll - 50) / 100;

if(opacity < 0){
opacity = 0;
}

if(opacity > 1){
opacity = 1;
}

topo.style.opacity = opacity;

});

</script>

</body>
</html>
